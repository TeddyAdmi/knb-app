<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КНБ PKOIN</title>

  <!-- Встроенный легкий адаптер Bastyon API (без внешних зависимостей) -->
  <script>
    window.BastyonApp = class {
      constructor() {
        this.isInsideBastyon = window.self !== window.top;
      }
      async getAccount() {
        if (window.make && window.make.get && window.make.get.account) {
          return await window.make.get.account();
        }
        return { address: "P_TESTNET_DEMO_ADDRESS_12345" };
      }
      async makePayment(amount, message) {
        if (window.make && window.make.payment) {
          return await window.make.payment({ amount, message });
        }
        alert(`[Эмуляция Кошелька]\nОтправка ${amount} PKOIN\nСообщение: ${message}`);
        return { txid: "demo_tx_" + Date.now() };
      }
    };
    window.bastyon = new window.BastyonApp();
  </script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #090A0F, #171925, #0B0E14);
      --card-bg: rgba(255, 255, 255, 0.05);
      --accent-pink: #FF007A;
      --accent-cyan: #00F6FF;
      --accent-yellow: #FFDE59;
      --text-color: #FFFFFF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      margin-bottom: 20px;
    }

    .logo {
      font-size: 20px;
      font-weight: 900;
      background: linear-gradient(45deg, var(--accent-cyan), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .wallet-status {
      font-size: 13px;
      background: rgba(0, 246, 255, 0.1);
      color: var(--accent-cyan);
      padding: 6px 12px;
      border-radius: 12px;
      border: 1px solid rgba(0, 246, 255, 0.3);
    }

    .card {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 25px;
      text-align: center;
    }

    .moves-grid {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 25px 0;
    }

    .move-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      font-size: 36px;
      cursor: pointer;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .move-btn:hover, .move-btn.selected {
      border-color: var(--accent-pink);
      background: rgba(255, 0, 122, 0.2);
      transform: scale(1.05);
    }

    .btn-main {
      background: linear-gradient(45deg, var(--accent-pink), var(--accent-cyan));
      color: #fff;
      border: none;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">🪨 ✂️ 📄 КНБ PKOIN</div>
    <div class="wallet-status" id="walletAddr">Инициализация...</div>
  </header>

  <div class="card">
    <h2>Создать дуэль</h2>
    <p style="color:#aaa; font-size:14px; margin-top:5px;">Ставка: 1 PKOIN (Комиссия 5% удерживается на приложении)</p>

    <div class="moves-grid">
      <div class="move-btn" onclick="selectMove('rock', this)">🪨</div>
      <div class="move-btn" onclick="selectMove('scissors', this)">✂️</div>
      <div class="move-btn" onclick="selectMove('paper', this)">📄</div>
    </div>

    <button class="btn-main" onclick="play()">Оплатить 1 PKOIN и создать стол</button>
  </div>

  <script>
    let selectedMove = null;

    async function initWallet() {
      try {
        const acc = await window.bastyon.getAccount();
        document.getElementById('walletAddr').innerText = `Кошелек: ${acc.address.substring(0,6)}...${acc.address.slice(-4)}`;
      } catch (e) {
        document.getElementById('walletAddr').innerText = "Готов к работе";
      }
    }

    function selectMove(move, elem) {
      selectedMove = move;
      document.querySelectorAll('.move-btn').forEach(b => b.classList.remove('selected'));
      elem.classList.add('selected');
    }

    async function play() {
      if (!selectedMove) {
        alert("Выберите вариант: Камень, Ножницы или Бумага!");
        return;
      }
      const salt = Math.random().toString(36).substring(2);
      const commit = btoa(selectedMove + ":" + salt);

      await window.bastyon.makePayment(1, `КНБ Игра [Commit: ${commit}]`);
    }

    window.addEventListener('load', initWallet);
  </script>
</body>
</html>
